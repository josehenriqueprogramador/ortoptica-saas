version: '3.8'

services:
  # 1. Banco de Dados em Memória (Sessões Clínicas em Tempo Real)
  redis:
    image: redis:7-alpine
    container_name: ortoptica_redis
    ports:
      - "6379:6379"
    restart: always

  # 2. Microsserviço de Visão Computacional e Processamento Biométrico
  ml_service:
    build:
      context: ./ml_service
      dockerfile: Dockerfile
    container_name: ortoptica_ml_service
    ports:
      - "${API_PORT:-8000}:${API_PORT:-8000}"
    volumes:
      - ./ml_service:/app
    environment:
      - ENV=${ENV:-development}
      - DATABASE_URL=${DATABASE_URL:-sqlite+aiosqlite:///app/ortoptica.db}
      - REDIS_URL=redis://redis:6379/0
    depends_on:
      - redis
    restart: always

  # 3. Painel Web Administrativo (Interface do Médico)
  painel_admin:
    build:
      context: ./painel_admin
      dockerfile: Dockerfile
    container_name: ortoptica_painel_admin
    ports:
      - "${FRONTEND_PORT:-5173}:${FRONTEND_PORT:-5173}"
    volumes:
      - ./painel_admin:/app
      - /app/node_modules
    environment:
      - VITE_API_URL=${VITE_API_URL:-http://localhost:8000}
    depends_on:
      - ml_service
    restart: always
