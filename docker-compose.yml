version: '3.8'

services:
  # 1. Microsserviço de Visão Computacional e Processamento Biométrico
  ml_service:
    build:
      context: ./ml_service
      dockerfile: Dockerfile
    container_name: ortoptica_ml_service
    ports:
      - "${API_PORT}:${API_PORT}"
    volumes:
      - ./ml_service:/app
    environment:
      - ENV=${ENV}
      - DATABASE_URL=${DATABASE_URL}
    restart: always

  # 2. Painel Web Administrativo (Interface do Médico)
  painel_admin:
    build:
      context: ./painel_admin
      dockerfile: Dockerfile
    container_name: ortoptica_painel_admin
    ports:
      - "${FRONTEND_PORT}:${FRONTEND_PORT}"
    volumes:
      - ./painel_admin:/app
      - /app/node_modules
    environment:
      - VITE_API_URL=${VITE_API_URL}
    depends_on:
      - ml_service
    restart: always
