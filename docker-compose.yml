version: '3.8'

services:
  # 1. Microsserviço de Visão Computacional e Processamento Biométrico
  ml_service:
    build:
      context: ./ml_service
      dockerfile: Dockerfile
    container_name: ortoptica_ml_service
    ports:
      - "8000:8000"
    volumes:
      - ./ml_service:/app
    environment:
      - ENV=development
      - DATABASE_URL=sqlite+aiosqlite:///app/ortoptica.db
    restart: always

  # 2. Painel Web Administrativo (Interface do Médico)
  painel_admin:
    build:
      context: ./painel_admin
      dockerfile: Dockerfile
    container_name: ortoptica_painel_admin
    ports:
      - "5173:5173"
    volumes:
      - ./painel_admin:/app
      - /app/node_modules
    environment:
      - VITE_API_URL=http://localhost:8000
    depends_on:
      - ml_service
    restart: always
